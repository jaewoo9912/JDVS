# 사이트 제목 — 원하는 이름으로 바꾸세요.
site_name: DV STUDY

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR      # 한글 본문용 폰트
    code: JetBrains Mono    # 코드용 폰트
  features:
    - navigation.indexes        # 섹션(폴더) 자체를 대표 페이지로
    - navigation.expand         # 사이드바 폴더를 펼친 채로 표시
    - navigation.top            # 맨 위로 버튼
    - navigation.tracking       # URL에 현재 위치 반영
    - navigation.footer         # 이전/다음 페이지 네비
    - content.code.copy         # 코드 복사 버튼
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight
  # 기본 라이트 + 우상단 버튼으로 다크 토글
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 다크 모드로
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로

markdown_extensions:
  - attr_list             # 홈의 카드 레이아웃에 필요
  - md_in_html            # 홈의 카드 레이아웃에 필요
  - admonition            # 노트/경고 박스 (!!! note)
  - pymdownx.emoji:         # :material-...: 아이콘 실제 렌더링
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:   # 코드블록 강화 + mermaid 다이어그램
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: ko

extra_css:
  - stylesheets/extra.css

# 메뉴(목차) 구조. 새 글을 추가하면 여기에 등록하세요.
# "이름:" (콜론만) = 묶음 카테고리 / "이름: 경로.md" = 클릭하면 가는 페이지
nav:
  - 홈: index.md
  - DV:
      - dv/intro.md                 # DV 폴더를 누르면 열리는 대표(개요) 페이지
      - DV Workflow: dv/workflow.md
      - UVM: dv/uvm.md
  - 메모리 & 스토리지:
      - memory-storage/intro.md
      - DRAM: memory-storage/dram.md
  - SoC & 보안:
      - soc-security/intro.md
      - 시큐어 부트: soc-security/secure-boot.md
